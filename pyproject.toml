[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-manifest"
version = "0.2.0"
description = "Reviewable engineering manifests and GAP export validation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5", "pdfplumber>=0.11", "Pillow>=10"]
integration = ["mcp==2.3.0", "pywin32==312; sys_platform == 'win32'"]

[project.scripts]
gap-manifest = "gap_manifest.cli:main"
gap-integration = "gap_integration.cli:main"
gap-agent = "gap_agent.cli:main"

[tool.setuptools.packages.find]
include = ["gap_manifest*", "gap_integration*", "gap_agent*"]
